name: Build and publish desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要构建并发布的版本 tag，例如 v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"
          test "v${VERSION}" = "${RELEASE_TAG}"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: Sentinel Flow ${{ inputs.release_tag || github.ref_name }}
          releaseBody: |
            Sentinel Flow ${{ inputs.release_tag || github.ref_name }} desktop installers.

            - macOS: DMG (universal Apple Silicon + Intel)
            - Windows: MSI / NSIS installer
            - Linux: AppImage / DEB

            应用监控数据默认只保存在本机；本 Release 仅用于分发安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
